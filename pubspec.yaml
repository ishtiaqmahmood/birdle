name: birdle
description: "A polished Wordle-inspired word guessing game built with Flutter. Challenge yourself to find the hidden five-letter word in six attempts or less!"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  share_plus: ^7.2.1
  provider: ^6.1.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
